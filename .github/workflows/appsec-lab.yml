# Calibration pipeline for the OWASP Juice Shop fork (dankmessiah/juice-shop).
# Copy to .github/workflows/appsec-lab.yml in the fork. Same SAST/secrets/SCA jobs as appsec-rpg,
# plus a ZAP baseline against the matching upstream image. Warn-only: Juice Shop is meant to be vulnerable.
# Steps: docs/lab/SETUP-CHECKLIST.md, section "Juice Shop fork".
name: appsec-lab

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: appsec-lab-${{ github.ref }}
  cancel-in-progress: true

env:
  SEMGREP_IMAGE: semgrep/semgrep:1.184.0@sha256:cc1b68266f267878b39739373ea9985b9a78e5d64497dd875c8de100b22695ed
  GITLEAKS_IMAGE: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
  ZAP_IMAGE: ghcr.io/zaproxy/zaproxy:2.17.0@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
  TRIVY_VERSION: v0.70.0
  SCANNER_UA: appsec-lab-scanner

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep scan
        continue-on-error: true
        run: |
          local_rules=()
          docker run --rm -v "$PWD:/src" -w /src "$SEMGREP_IMAGE" \
            semgrep scan --metrics=off --disable-version-check \
              --config p/owasp-top-ten --config p/javascript --config p/nodejs --config p/docker \
              "${local_rules[@]}" \
              --sarif --output /src/semgrep.sarif
      - name: Summarise
        if: always()
        run: .github/scripts/sarif-summary.sh semgrep.sarif Semgrep >> "$GITHUB_STEP_SUMMARY"
      - name: Upload SARIF to Security tab
        if: always() && (github.event.repository.private == false || vars.CODE_SCANNING_ENABLED == 'true') && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sarif-semgrep
          path: semgrep.sarif
          if-no-files-found: warn

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (full history)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            "$GITLEAKS_IMAGE" git /repo --redact --no-banner --exit-code 0 \
              --report-format sarif --report-path /repo/gitleaks.sarif
      - name: Summarise
        if: always()
        run: .github/scripts/sarif-summary.sh gitleaks.sarif Gitleaks >> "$GITHUB_STEP_SUMMARY"
      - name: Upload SARIF to Security tab
        if: always() && (github.event.repository.private == false || vars.CODE_SCANNING_ENABLED == 'true') && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sarif-gitleaks
          path: gitleaks.sarif
          if-no-files-found: warn

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analyze
        continue-on-error: true
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: codeql-js
          upload: ${{ (github.event.repository.private == false || vars.CODE_SCANNING_ENABLED == 'true') && 'always' || 'never' }}
          output: codeql-results
      - name: Summarise
        if: always()
        run: |
          shopt -s nullglob
          for f in codeql-results/*.sarif; do .github/scripts/sarif-summary.sh "$f" CodeQL; done >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sarif-codeql
          path: codeql-results/
          if-no-files-found: warn

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy fs (npm dependencies)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.TRIVY_VERSION }}
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"
      - name: Trivy config (Dockerfile, docker-compose.yml)
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: config
          scan-ref: .
          format: sarif
          output: trivy-config.sarif
          exit-code: "0"
      - name: CycloneDX SBOM
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          skip-setup-trivy: true
          scan-type: fs
          scan-ref: .
          format: cyclonedx
          output: sbom.cdx.json
      - name: Summarise
        if: always()
        run: |
          {
            .github/scripts/sarif-summary.sh trivy-fs.sarif "Trivy fs (SCA)"
            .github/scripts/sarif-summary.sh trivy-config.sarif "Trivy config (IaC)"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload fs SARIF
        if: always() && (github.event.repository.private == false || vars.CODE_SCANNING_ENABLED == 'true') && hashFiles('trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
      - name: Upload config SARIF
        if: always() && (github.event.repository.private == false || vars.CODE_SCANNING_ENABLED == 'true') && hashFiles('trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: trivy-config.sarif
          category: trivy-config
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sarif-trivy
          path: |
            trivy-fs.sarif
            trivy-config.sarif
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          if-no-files-found: warn

  dast-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      juice:
        image: bkimminich/juice-shop:v20.3.0
        ports: ["3000:3000"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Wait for Juice Shop
        run: for i in $(seq 1 60); do curl -fsS http://localhost:3000 >/dev/null && exit 0; sleep 2; done; exit 1
      - name: ZAP baseline
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: http://localhost:3000
          docker_name: ${{ env.ZAP_IMAGE }}
          cmd_options: -a -m 3 -z "-config connection.defaultUserAgent=appsec-lab-scanner"
          allow_issue_writing: false
          fail_action: false
          artifact_name: zap-baseline
